# Banco de desenvolvimento
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trajetto_dev}?allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useSSL=false&useUnicode=yes&characterEncoding=UTF-8&useLegacyDatetimeCode=true&createDatabaseIfNotExist=true&useTimezone=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Biblioteca21.}

# Banco NoSQL de desenvolvimento (catalogo de pontos turisticos). Sobe com
# `docker compose up -d` (docker-compose.yml na raiz do backend).
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:trajetto_dev}

# SQL logging (util pra debug local)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# População de demonstração do painel gerencial (DataSeeder).
# Desligada por padrão: os testes de integração rodam neste mesmo perfil e
# devem encontrar a base como a deixaram. Ligue com SEED_DEMO_DATA=true.
trajetto.seed-demo-data=${SEED_DEMO_DATA:false}
