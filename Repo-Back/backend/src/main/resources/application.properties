# Spring Application Name
spring.application.name=backend
server.port=8080

# Ambiente ativo (dev/test/prod). Definido por env var no CI/deploy.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA and Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# O esquema e mantido pelas migracoes do Flyway (src/main/resources/db/migration).
# A aplicacao apenas confere se o banco bate com as entidades e nunca mais o altera.
spring.jpa.hibernate.ddl-auto=validate

# Flyway - versionamento do esquema do banco
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Bancos que ja existiam antes do Flyway sao marcados na versao 1 e seguem dai em diante
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline schema

# Firebase bucket
#firebase.storage.bucket=meownager-firebase25.firebasestorage.app

# Aumenta o limite para upload de arquivos para 50 Megabytes
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.config.import=optional:classpath:secrets.properties

# Segredos vem de variaveis de ambiente ou do secrets.properties local (fora do git).
# Modelo em secrets.properties.example.
jwt.secret=${JWT_SECRET}

server.address=0.0.0.0

# Email (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
