name: Backend CI

on:
  pull_request:
    branches: [ dev, test, prod ]
    paths:
      - 'Repo-Back/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [ dev, test, prod ]
    paths:
      - 'Repo-Back/backend/**'

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Repo-Back/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: trajetto_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build and run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_USERNAME: root
          DB_PASSWORD: test
          ORS_API_KEY: ci-dummy-key
        run: ./mvnw -B clean verify
