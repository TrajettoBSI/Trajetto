name: Backend CI

on:
  # Sem filtro de pasta no PR: a verificacao e obrigatoria para integrar a branch protegida,
  # entao precisa responder em todo PR, e nao so nos que mexem no backend.
  pull_request:
    branches: [ dev, test, prod ]
  push:
    branches: [ dev, test, prod ]
    paths:
      - 'Repo-Back/backend/**'

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Repo-Back/backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: trajetto_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build and run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_USERNAME: root
          DB_PASSWORD: test
          ORS_API_KEY: ci-dummy-key
          JWT_SECRET: ci-jwt-secret-only-for-tests-0123456789abcdef
          ADMIN_PASSWORD: ci-admin-password
        run: ./mvnw -B clean verify

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f target/site/jacoco/jacoco.csv ]; then exit 0; fi
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          print('## Cobertura de testes do backend (JaCoCo)')
          print()
          print('| Metrica | Cobertura | Cobertos / total |')
          print('|---|---|---|')
          for nome, chave in [('Linhas', 'LINE'), ('Instrucoes', 'INSTRUCTION'), ('Desvios (branches)', 'BRANCH'), ('Metodos', 'METHOD')]:
              perdidos = sum(int(r[chave + '_MISSED']) for r in rows)
              cobertos = sum(int(r[chave + '_COVERED']) for r in rows)
              print(f'| {nome} | {cobertos / (perdidos + cobertos) * 100:.1f}% | {cobertos} / {perdidos + cobertos} |')
          print()
          print('Minimo exigido pelo build: 75% de linhas e de instrucoes.')
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura-jacoco
          path: Repo-Back/backend/target/site/jacoco/
          if-no-files-found: ignore
