name: Frontend CI

on:
  pull_request:
    branches: [ dev, test, prod ]
    paths:
      - 'Repo-Front/Trajetto/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [ dev, test, prod ]
    paths:
      - 'Repo-Front/Trajetto/**'

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Repo-Front/Trajetto

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Repo-Front/Trajetto/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Architecture test
        run: npm run test:arquitetura

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then exit 0; fi
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const linhas = [
            ['Linhas', t.lines], ['Instrucoes (statements)', t.statements],
            ['Funcoes', t.functions], ['Desvios (branches)', t.branches],
          ].map(([nome, m]) => '| ' + nome + ' | ' + m.pct.toFixed(1) + '% | ' + m.covered + ' / ' + m.total + ' |');
          console.log(['## Cobertura de testes do frontend (Jest)', '', '| Metrica | Cobertura | Cobertos / total |', '|---|---|---|', ...linhas, '', 'Minimo exigido: 75% em linhas, instrucoes, funcoes e desvios.'].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura-frontend
          path: Repo-Front/Trajetto/coverage/
          if-no-files-found: ignore
